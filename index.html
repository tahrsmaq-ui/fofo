<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحر عيونها... ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #131520 0%, #07080d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 100%;
            position: relative;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* حاوية الصورة مع إضاءة وهج فخمة */
        .image-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        h1 {
            font-size: 1.7rem;
            margin-bottom: 20px;
            color: #f3f4f6;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .quote-box {
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        p.quote {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #e5e7eb;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); transform: scale(1.03); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* تأثير النجوم والشرارات عند النقر */
        .sparkle {
            position: absolute;
            pointer-events: none;
            background: #e879f9;
            border-radius: 50%;
            animation: animateSparkle 0.8s linear forwards;
        }

        @keyframes animateSparkle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- صورة عيونها مع تأثير הوهج -->
        <div class="image-container">
            <img src="mylove.jpg" alt="عيونها">
        </div>

        <h1>إلى أعمق نظرة... ✨</h1>
        
        <div class="quote-box">
            <p class="quote" id="quoteText">"في عيونِكِ تفاصيلٌ صغيرة.. تختصر كل جمالِ هذا العالم بـ نظرة."</p>
        </div>
        
        <button class="btn" onclick="nextMessage()">تابعي القراءة ✨</button>
    </div>

    <script>
        const messages = [
            "\"في عيونِكِ تفاصيلٌ صغيرة.. تختصر كل جمالِ هذا العالم بـ نظرة.\"",
            "\"يقال إن العيون لغة لا تحتاج إلى كلمات.. وعيونك حكوا لي كلشي كنت خايف أسأل عنه.\"",
            "\"من بين كل الشغلات اللي ممكن تلفت القلب، عيونك لحالها كانت قصة تانية خالص.\"",
            "\"وبصراحة وبكل أمانة.. أنا معجب فيكِ، وبكل سحر بيلمع بعيونك. ✨\""
        ];

        let index = 0;

        function nextMessage() {
            const quoteElement = document.getElementById("quoteText");
            quoteElement.style.opacity = 0;
            quoteElement.style.transform = "translateY(10px)";
            
            setTimeout(() => {
                index = (index + 1) % messages.length;
                quoteElement.innerText = messages[index];
                quoteElement.style.opacity = 1;
                quoteElement.style.transform = "translateY(0)";
            }, 300);
        }

        // تفاعل الشرارات السحرية عند الكبس
        document.addEventListener('click', function(e) {
            for (let i = 0; i < 8; i++) {
                let sparkle = document.createElement('span');
                sparkle.classList.add('sparkle');
                document.body.appendChild(sparkle);

                let size = Math.random() * 8 + 4;
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';

                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';

                let x = (Math.random() - 0.5) * 200;
                let y = (Math.random() - 0.5) * 200;

                sparkle.style.setProperty('--x', x + 'px');
                sparkle.style.setProperty('--y', y + 'px');

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        });
    </script>
</body>
</html>
